ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map              # Standard ROS 2 frame names
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom           # EKF outputs the odom -> base_link transform

    # Wheel Odometry (from Gazebo/Hardware)
    odom0: /odom
    odom0_config: [true,  true,  false, # x, y, z
                   false, false, true,  # roll, pitch, yaw
                   true,  true,  false, # vx, vy, vz
                   false, false, true,  # vroll, vpitch, vyaw
                   false, false, false] # ax, ay, az

    # IMU Data (if available in your URDF)
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_differential: false
    imu0_relative: true